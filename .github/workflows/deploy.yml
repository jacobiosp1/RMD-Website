name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. 设置 R 环境 ----------
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-pandoc@v2

      # ---------- 2. 设置 Node.js (staticryptR 依赖) ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ---------- 3. 安装 staticrypt CLI (必需) ----------
      - name: Install staticrypt CLI
        run: npm install -g staticrypt

      # ---------- 4. 安装所有 R 包（包含 staticryptR） ----------
      - name: Install R packages
        run: |
          Rscript -e "options(repos = c(CRAN = 'https://cloud.r-project.org/'))"
          Rscript -e "install.packages(c('rmarkdown', 'tidyverse', 'knitr', 'kableExtra', 'ggplot2', 'staticryptR'))"

      # ---------- 5. 构建网站 ----------
      - name: Build site
        run: Rscript -e "rmarkdown::render_site()"

      # ---------- 6. 加密整个 _site 文件夹 ----------
      - name: Encrypt site with staticryptR
        env:
          # 从 GitHub Secrets 读取密码
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          Rscript -e "
            library(staticryptR)
            staticryptr(
              files = '_site/index.html',
              directory = '_site',
              password = Sys.getenv('SITE_PASSWORD'),
              remember = 30,    
              short = TRUE,
              recursive = FALSE
            )
          "

      # ---------- 7. 部署到 GitHub Pages ----------
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4